name: Merge upstream

# Every night, upstream's main is merged into codex-images and pushed; Docker
# builds the image (with its own container smoke test) on the push. Since the
# fork gave its copy layer up (2026-10-28) it holds only a handful of single-
# line hooks, so upstream's own suite is not run here as a gate any more:
# a conflict fails the run red for a hand to sort it out, a merge that
# doesn't build shows up in Docker's build, and upstream's behaviour-level
# breakage is upstream's to carry.

on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-upstream

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex-images
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          git config user.name "merge-upstream-bot"
          git config user.email "noreply@users.noreply.github.com"
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          if git merge upstream/main --no-edit; then
            # a merge carrying one of upstream's workflow changes is refused
            # a push whole: GITHUB_TOKEN has no workflows permission, and the
            # permissions: block above cannot grant one (it is not a valid
            # scope there; writing it in broke parsing and stalled the
            # schedule for two days). The fork's workflows are its own, so
            # the merge's are wiped and restored from before it — a plain
            # checkout of the path leaves a file upstream added staged in
            # the merge, and the push is refused again.
            git rm -q -rf .github/workflows
            git checkout ORIG_HEAD -- .github/workflows
            git diff --cached --quiet || git commit -m "keep the fork's workflows"
            if [ "$(git rev-parse HEAD)" = "$before" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "::error::upstream conflicts with codex-images — merge upstream/main by hand, resolve, push"
            exit 1
          fi

      # A merge that doesn't compile must not be pushed: one cheap build,
      # no tests (upstream's suite is not our gate; see the header).
      - uses: actions/setup-go@v6
        if: steps.merge.outputs.changed == 'true'
        with:
          go-version-file: go.mod

      - name: Build
        if: steps.merge.outputs.changed == 'true'
        run: go build -tags nogui ./...

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin codex-images
