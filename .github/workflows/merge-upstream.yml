name: Merge upstream

# Every night, upstream's main is merged into codex-images: a clean merge
# that builds and tests green is pushed (Docker then builds the image);
# anything else fails the run red for a hand to sort it out.

on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-upstream

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex-images
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          git config user.name "merge-upstream-bot"
          git config user.email "noreply@users.noreply.github.com"
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          if git merge upstream/main --no-edit; then
            # a merge carrying one of upstream's workflow changes is refused
            # a push whole: GITHUB_TOKEN has no workflows permission, and the
            # permissions: block above cannot grant one (it is not a valid
            # scope there; writing it in broke parsing and stalled the
            # schedule for two days). The fork's workflows are its own, so
            # the merge's are wiped and restored from before it — a plain
            # checkout of the path leaves a file upstream added staged in
            # the merge, and the push is refused again.
            git rm -q -r .github/workflows
            git checkout ORIG_HEAD -- .github/workflows
            git diff --cached --quiet || git commit -m "keep the fork's workflows"
            if [ "$(git rev-parse HEAD)" = "$before" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "::error::upstream conflicts with codex-images — merge upstream/main by hand, resolve, push"
            exit 1
          fi

      - name: Install GTK and WebKitGTK
        if: steps.merge.outputs.changed == 'true'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v6
        if: steps.merge.outputs.changed == 'true'
        with:
          go-version-file: go.mod

      # the packages the fork touches and the ones that read its catalogs;
      # the pushed merge then runs the full suite (test.yml) on its own
      - name: Test
        if: steps.merge.outputs.changed == 'true'
        run: go test -tags gtk3 ./internal/gateway/ ./internal/agent/ ./internal/gui/ -count=1

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin codex-images
